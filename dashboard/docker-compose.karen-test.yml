# Optional local Postgres for Stage 6B-1.1 Karen persistence tests.
# Not used by Buddy production. Do not point this at production data.
#
#   docker compose -f docker-compose.karen-test.yml up -d
#   set KAREN_TEST_DATABASE_URL=postgresql://karen:karen@127.0.0.1:55432/karen_test
#   npx tsx --test lib/karen/interview/prisma-store.pg.test.ts

services:
  karen-pg-test:
    image: postgres:16-alpine
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: karen
      POSTGRES_PASSWORD: karen
      POSTGRES_DB: karen_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karen -d karen_test"]
      interval: 3s
      timeout: 3s
      retries: 20
