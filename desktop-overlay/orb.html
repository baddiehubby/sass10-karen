<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buddy Shadow Companion</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 120px;
        height: 120px;
        overflow: hidden;
        background: transparent;
        -webkit-app-region: no-drag;
        user-select: none;
      }
      .stage {
        position: relative;
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .particle {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(167, 139, 250, 0.7);
        animation: float 4s ease-in-out infinite;
      }
      .particle:nth-child(1) { top: 12%; left: 18%; animation-delay: 0s; }
      .particle:nth-child(2) { top: 70%; left: 12%; animation-delay: 0.8s; }
      .particle:nth-child(3) { top: 20%; right: 14%; animation-delay: 1.4s; }
      .particle:nth-child(4) { bottom: 16%; right: 22%; animation-delay: 2s; }
      @keyframes float {
        0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
        50% { transform: translateY(-6px) scale(1.2); opacity: 1; }
      }
      .sacred-ring {
        position: absolute;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 1px solid rgba(167, 139, 250, 0.35);
        animation: ring-spin 18s linear infinite;
      }
      .sacred-ring::before {
        content: "";
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        border: 1px dashed rgba(129, 140, 248, 0.25);
      }
      @keyframes ring-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .orb-hit {
        position: relative;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        z-index: 3;
      }
      .orb {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #c4b5fd 0%, #7c3aed 45%, #312e81 100%);
        box-shadow:
          0 0 28px rgba(124, 58, 237, 0.55),
          inset 0 -8px 18px rgba(15, 23, 42, 0.35);
        animation: breathe 3.2s ease-in-out infinite;
        transition: background 0.8s ease, box-shadow 0.8s ease;
        pointer-events: none;
      }
      .orb::after {
        content: "";
        position: absolute;
        top: 18%;
        left: 22%;
        width: 22%;
        height: 14%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        filter: blur(1px);
      }
      .orb.mood-happy {
        background: radial-gradient(circle at 35% 30%, #fde68a 0%, #f59e0b 50%, #b45309 100%);
        box-shadow: 0 0 32px rgba(245, 158, 11, 0.5);
      }
      .orb.mood-concerned {
        background: radial-gradient(circle at 35% 30%, #fca5a5 0%, #ef4444 50%, #7f1d1d 100%);
        box-shadow: 0 0 32px rgba(239, 68, 68, 0.45);
      }
      .orb.mood-thinking {
        background: radial-gradient(circle at 35% 30%, #93c5fd 0%, #3b82f6 50%, #1e3a8a 100%);
        box-shadow: 0 0 32px rgba(59, 130, 246, 0.45);
      }
      .orb.mood-excited {
        background: radial-gradient(circle at 35% 30%, #f9a8d4 0%, #ec4899 50%, #831843 100%);
        box-shadow: 0 0 32px rgba(236, 72, 153, 0.5);
      }
      .orb.mood-sleepy {
        background: radial-gradient(circle at 35% 30%, #a5b4fc 0%, #6366f1 50%, #312e81 100%);
        box-shadow: 0 0 28px rgba(99, 102, 241, 0.4);
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      .orb.pulse-once {
        animation: pulse-click 0.55s ease-out;
      }
      @keyframes pulse-click {
        0% { transform: scale(1); }
        40% { transform: scale(1.18); }
        100% { transform: scale(1); }
      }
      .sparkle {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff;
        pointer-events: none;
        animation: sparkle-burst 0.7s ease-out forwards;
      }
      @keyframes sparkle-burst {
        0% { transform: translate(0, 0) scale(0.2); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
      }
      .guidance {
        position: absolute;
        bottom: 100%;
        right: 0;
        max-width: 200px;
        margin-bottom: 8px;
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(167, 139, 250, 0.35);
        color: #e9d5ff;
        font: 11px/1.35 system-ui, sans-serif;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.35s ease, transform 0.35s ease;
        pointer-events: none;
        z-index: 5;
      }
      .guidance.visible {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="particles" aria-hidden="true">
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
      </div>
      <div class="sacred-ring" aria-hidden="true"></div>
      <div class="orb-hit" id="hit" title="Buddy">
        <div class="orb mood-neutral" id="orb"></div>
      </div>
      <div class="guidance" id="guidance"></div>
    </div>
    <script>
      const orb = document.getElementById("orb");
      const hit = document.getElementById("hit");
      const guidance = document.getElementById("guidance");
      const stage = document.getElementById("stage");

      const MOOD_MESSAGES = {
        neutral: "I'm here with you.",
        happy: "Beautiful energy — keep going.",
        concerned: "Take a breath. You've got this.",
        thinking: "Pause when you need clarity.",
        excited: "That momentum looks great.",
        sleepy: "Rest is part of the work.",
      };

      function applyMood(mood) {
        orb.className = "orb mood-" + (mood || "neutral");
      }

      function showGuidance(text) {
        guidance.textContent = text;
        guidance.classList.add("visible");
        setTimeout(() => guidance.classList.remove("visible"), 3200);
      }

      function burstSparkles() {
        const rect = hit.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        for (let i = 0; i < 10; i++) {
          const el = document.createElement("span");
          el.className = "sparkle";
          const angle = (Math.PI * 2 * i) / 10;
          const dist = 28 + Math.random() * 18;
          el.style.left = cx - stage.getBoundingClientRect().left + "px";
          el.style.top = cy - stage.getBoundingClientRect().top + "px";
          el.style.setProperty("--tx", Math.cos(angle) * dist + "px");
          el.style.setProperty("--ty", Math.sin(angle) * dist + "px");
          stage.appendChild(el);
          setTimeout(() => el.remove(), 700);
        }
      }

      hit.addEventListener("click", () => {
        orb.classList.add("pulse-once");
        setTimeout(() => orb.classList.remove("pulse-once"), 560);
        burstSparkles();
        const mood = orb.className.match(/mood-(\w+)/)?.[1] || "neutral";
        showGuidance(MOOD_MESSAGES[mood] || MOOD_MESSAGES.neutral);
      });

      hit.addEventListener("mouseenter", () => {
        window.buddyOverlay?.setInteractive(true);
      });
      hit.addEventListener("mouseleave", () => {
        window.buddyOverlay?.setInteractive(false);
      });

      async function loadPresence() {
        const state = (await window.buddyOverlay?.getPresence?.()) || {
          currentMood: "neutral",
          companionName: "Buddy",
        };
        applyMood(state.currentMood);
        const next = state.guidanceQueue?.[0]?.text;
        if (next) showGuidance(next);
      }

      window.buddyOverlay?.onPresenceUpdate?.((state) => {
        applyMood(state.currentMood);
      });

      loadPresence();
    </script>
  </body>
</html>
